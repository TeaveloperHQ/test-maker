<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Test Maker 아이콘 (큰 크기용 — 64px 이상)

    teaveloper 공용 규격:
      · 800x800 라운드 사각형(rx 184), 112,112 에 배치
      · 공식 그라데이션 #6366f1 → #8b5cf6 → #06b6d4
      · 흰색 죽방(竹防) — 원 아래로 삼각이 이어진다. 밑변이 원보다 넓고 높이는 원 지름과 비슷하게.

    배치는 Teavel 아이콘("> 죽방")과 같다: 왼쪽에 앱의 표시, 오른쪽에 죽방(Teavel 과 같은 자리·크기).
    Test Maker 의 표시는 귀가 접힌 시험지와 글 줄이다.

    죽방을 시험지 안에 넣어 보았더니 원+삼각이 사람 모양으로 읽혀 '프로필 카드'처럼 보였다.
    그래서 둘을 나란히 둔다.

    작은 크기(16~48px)는 icon-small.svg.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect x="112" y="112" width="800" height="800" rx="184" fill="url(#g)"/>

  <!-- 시험지(죽방과 같은 높이대에 둔다): 오른쪽 위 귀를 접었다 -->
  <path d="M272 300 H418 L478 360 V620 Q478 660 438 660 H272 Q232 660 232 620 V340 Q232 300 272 300 Z" fill="#ffffff"/>
  <path d="M418 300 V336 Q418 360 442 360 H478 Z" fill="#c7d2fe"/>
  <!-- 글 줄 -->
  <g stroke="#8b5cf6" stroke-width="24" stroke-linecap="round">
    <line x1="284" y1="430" x2="426" y2="430"/>
    <line x1="284" y1="500" x2="426" y2="500"/>
    <line x1="284" y1="570" x2="372" y2="570"/>
  </g>

  <!-- 죽방 — Teavel 과 같은 자리·크기: 원 r88 · 밑변 202 · 높이 189 -->
  <g fill="#ffffff">
    <circle cx="646" cy="392" r="88"/>
    <path d="M646 451 L545 640 L747 640 Z"/>
  </g>
</svg>
